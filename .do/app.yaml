name: cellar-circle
services:
  - name: web
    github:
      repo: Petriedw/CellarCircle
      branch: main
      deploy_on_push: true
    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs
    envs:
      - key: APP_NAME
        value: Cellar Circle
        scope: RUN_AND_BUILD_TIME
      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME
      - key: APP_DEBUG
        value: "false"
        scope: RUN_AND_BUILD_TIME
      - key: APP_KEY
        value: replace-with-a-generated-laravel-app-key
        scope: RUN_TIME
        type: SECRET
      - key: APP_URL
        value: ${APP_URL}
        scope: RUN_TIME
      - key: LOG_CHANNEL
        value: stderr
        scope: RUN_TIME
      - key: DB_CONNECTION
        value: mysql
        scope: RUN_TIME
      - key: DB_HOST
        value: ${db.HOSTNAME}
        scope: RUN_TIME
      - key: DB_PORT
        value: ${db.PORT}
        scope: RUN_TIME
      - key: DB_DATABASE
        value: ${db.DATABASE}
        scope: RUN_TIME
      - key: DB_USERNAME
        value: ${db.USERNAME}
        scope: RUN_TIME
      - key: DB_PASSWORD
        value: ${db.PASSWORD}
        scope: RUN_TIME
        type: SECRET
databases:
  - name: db
    engine: MYSQL
    version: "8"
    production: false

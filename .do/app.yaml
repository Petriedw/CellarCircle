name: cellar-circle

services:
  - name: web
    github:
      repo: Petriedw/CellarCircle
      branch: main
      deploy_on_push: true

    dockerfile_path: Dockerfile
    source_dir: /
    http_port: 80
    instance_count: 1
    instance_size_slug: basic-xxs

    envs:
      - key: APP_NAME
        value: Cellar Circle
        scope: RUN_AND_BUILD_TIME

      - key: APP_ENV
        value: production
        scope: RUN_AND_BUILD_TIME

      - key: APP_DEBUG
        value: "false"
        scope: RUN_AND_BUILD_TIME

      - key: APP_URL
        value: https://cellarcircle-fvaba.ondigitalocean.app
        scope: RUN_TIME

      - key: LOG_CHANNEL
        value: stderr
        scope: RUN_TIME

      - key: DB_CONNECTION
        value: pgsql
        scope: RUN_TIME

      - key: DB_HOST
        value: ${dev-db-cellarcircle.HOSTNAME}
        scope: RUN_TIME

      - key: DB_PORT
        value: ${dev-db-cellarcircle.PORT}
        scope: RUN_TIME

      - key: DB_DATABASE
        value: ${dev-db-cellarcircle.DATABASE}
        scope: RUN_TIME

      - key: DB_USERNAME
        value: ${dev-db-cellarcircle.USERNAME}
        scope: RUN_TIME

      - key: DB_PASSWORD
        value: ${dev-db-cellarcircle.PASSWORD}
        scope: RUN_TIME
        type: SECRET

      - key: DB_SSLMODE
        value: require
        scope: RUN_TIME

databases:
  - name: dev-db-cellarcircle
    engine: PG
    version: "17"
    production: false
